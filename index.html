<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Portfolio 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Kanit",sans-serif;
    background:linear-gradient(135deg,#dff6ff,#eef8ff,#e5edff);
    min-height:100vh;
    overflow:hidden;
}


/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:70px;

    background:rgba(255,255,255,.85);
    backdrop-filter:blur(15px);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;

    z-index:1000;

    box-shadow:0 5px 20px rgba(80,150,190,.15);
}

.logo{
    font-size:25px;
    font-weight:600;
    color:#54b8df;
}

.menu{
    display:flex;
    gap:8px;
}

.menu button{

    border:none;

    background:transparent;

    color:#638394;

    padding:9px 13px;

    border-radius:20px;

    cursor:pointer;

    transition:.3s;

    font-family:"Kanit",sans-serif;
}

.menu button:hover,
.menu button.active{

    background:#8ed5f2;

    color:white;

}


/* ================= PAGES ================= */

.page{

    width:100%;
    height:100vh;

    padding-top:70px;

    display:none;

    align-items:center;
    justify-content:center;

    animation:pageAnimation .6s ease;

}

.page.active{
    display:flex;
}


@keyframes pageAnimation{

    from{
        opacity:0;
        transform:scale(.95) translateX(40px);
    }

    to{
        opacity:1;
        transform:scale(1) translateX(0);
    }

}


/* ================= IMAGE ================= */

.image-box{

    width:90%;
    max-width:950px;

    height:75vh;

    background:white;

    padding:12px;

    border-radius:30px;

    box-shadow:
        0 15px 50px rgba(70,150,190,.2);

    position:relative;

}

.image-box img{

    width:100%;
    height:100%;

    object-fit:contain;

    border-radius:22px;

    display:block;

}


/* ================= NUMBER ================= */

.number{

    position:absolute;

    top:25px;
    left:25px;

    background:rgba(255,255,255,.9);

    color:#5aaed1;

    padding:8px 18px;

    border-radius:30px;

    font-size:16px;

    box-shadow:0 5px 15px rgba(80,150,190,.15);

}


/* ================= NAVIGATION ================= */

.navigation{

    position:fixed;

    bottom:25px;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    align-items:center;

    gap:15px;

    background:rgba(255,255,255,.95);

    padding:10px 18px;

    border-radius:50px;

    box-shadow:0 8px 30px rgba(70,150,190,.2);

    z-index:1000;

}


.nav-btn{

    width:45px;
    height:45px;

    border:none;

    border-radius:50%;

    background:#8ed5f2;

    color:white;

    font-size:23px;

    cursor:pointer;

    transition:.3s;

}


.nav-btn:hover{

    background:#58bde5;

    transform:scale(1.1);

}


.page-number{

    color:#6791a3;

    min-width:80px;

    text-align:center;

}


/* ================= DOTS ================= */

.dots{

    position:fixed;

    right:20px;

    top:50%;

    transform:translateY(-50%);

    display:flex;

    flex-direction:column;

    gap:9px;

    z-index:900;

}


.dot{

    width:10px;
    height:10px;

    background:#c3dce6;

    border-radius:50%;

    cursor:pointer;

    transition:.3s;

}


.dot.active{

    background:#65c5e9;

    transform:scale(1.5);

    box-shadow:0 0 10px rgba(70,190,230,.5);

}


/* ================= MOBILE ================= */

@media(max-width:700px){

    header{

        height:60px;

        padding:0 15px;

    }

    .logo{

        font-size:20px;

    }

    .menu{

        display:none;

    }

    .page{

        padding-top:60px;

    }

    .image-box{

        width:92%;

        height:70vh;

        padding:8px;

        border-radius:20px;

    }

    .image-box img{

        border-radius:15px;

    }

    .dots{

        display:none;

    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        My Portfolio ♡
    </div>

    <div class="menu">

        <button onclick="goToPage(0)">01</button>

        <button onclick="goToPage(1)">02</button>

<!-- ================================================= -->

<!-- ================= DOTS ================= -->

<div class="dots">

    <div class="dot active" onclick="goToPage(0)"></div>

</div>



<!-- ================= BUTTON ================= -->

<div class="navigation">

    <button
        class="nav-btn"
        onclick="previousPage()">
        ←
    </button>


    <div
        class="page-number"
        id="pageNumber">

        หน้า 1 / 10

    </div>


    <button
        class="nav-btn"
        onclick="nextPage()">
        →
    </button>

</div>



<script>


let currentPage = 0;


const pages =
    document.querySelectorAll(".page");


const dots =
    document.querySelectorAll(".dot");


const menuButtons =
    document.querySelectorAll(".menu button");



/* ================= GO TO PAGE ================= */

function goToPage(number){

    if(number < 0){

        number = 9;

    }


    if(number > 9){

        number = 0;

    }


    currentPage = number;


    /* ซ่อนทุกหน้า */

    pages.forEach(function(page){

        page.classList.remove("active");

    });


    /* แสดงหน้าที่เลือก */

    pages[currentPage]
        .classList.add("active");


    /* เปลี่ยนจุด */

    dots.forEach(function(dot){

        dot.classList.remove("active");

    });


    dots[currentPage]
        .classList.add("active");


    /* เปลี่ยนเมนู */

    menuButtons.forEach(function(button){

        button.classList.remove("active");

    });


    menuButtons[currentPage]
        .classList.add("active");


    /* เปลี่ยนเลขหน้า */

    document.getElementById("pageNumber")
        .innerText =
        "หน้า " +
        (currentPage + 1) +
        " / 10";

}



/* ================= NEXT ================= */

function nextPage(){

    currentPage++;

    if(currentPage > 9){

        currentPage = 0;

    }

    goToPage(currentPage);

}



/* ================= PREVIOUS ================= */

function previousPage(){

    currentPage--;

    if(currentPage < 0){

        currentPage = 9;

    }

    goToPage(currentPage);

}



/* ================= KEYBOARD ================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "ArrowRight"){

            nextPage();

        }


        if(event.key === "ArrowLeft"){

            previousPage();

        }

    }
);



/* ================= SWIPE MOBILE ================= */

let startX = 0;


document.addEventListener(
    "touchstart",
    function(event){

        startX =
            event.touches[0].clientX;

    }
);


document.addEventListener(
    "touchend",
    function(event){

        let endX =
            event.changedTouches[0].clientX;

        let difference =
            startX - endX;


        if(Math.abs(difference) > 50){

            if(difference > 0){

                nextPage();

            }else{

                previousPage();

            }

        }

    }
);


/* เริ่มหน้าแรก */

goToPage(0);

</script>
